{% extends "base.html" %}

{% block title %}编辑文章 - Augen 博客{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800">✏️ 编辑文章</h1>
        <p class="text-gray-500 mt-1">修改你的文章内容</p>
    </div>

    <form method="POST" action="{{ url_for('edit', article_id=article.id) }}" 
          class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 md:p-8">
        <div class="space-y-6">
            {# 标题输入 #}
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-2">
                    文章标题 <span class="text-red-500">*</span>
                </label>
                <input type="text" 
                       id="title" 
                       name="title" 
                       required
                       value="{{ article.title }}"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>

            {# 内容输入 #}
            <div>
                <label for="content" class="block text-sm font-medium text-gray-700 mb-2">
                    文章内容 <span class="text-red-500">*</span>
                </label>
                <textarea id="content" 
                          name="content" 
                          required
                          rows="12"
                          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition resize-y">{{ article.content }}</textarea>
            </div>

            {# 提交按钮 #}
            <div class="flex items-center gap-4 pt-4">
                <button type="submit" 
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg shadow-sm transition-colors">
                    保存修改 💾
                </button>
                <a href="{{ url_for('post', article_id=article.id) }}" 
                   class="text-gray-500 hover:text-gray-700 text-sm transition-colors">
                    取消
                </a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
