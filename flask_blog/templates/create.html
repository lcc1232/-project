{% extends "base.html" %}

{% block title %}写文章 - Augen 博客{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800">✍️ 写新文章</h1>
        <p class="text-gray-500 mt-1">分享你的思考和见解</p>
    </div>

    <form method="POST" action="{{ url_for('create') }}" 
          class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 md:p-8">
        <div class="space-y-6">
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-2">
                    文章标题 <span class="text-red-500">*</span>
                </label>
                <input type="text" 
                       id="title" 
                       name="title" 
                       required
                       placeholder="输入一个吸引人的标题..."
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>

            <div>
                <label for="content" class="block text-sm font-medium text-gray-700 mb-2">
                    文章内容 <span class="text-red-500">*</span>
                </label>
                <textarea id="content" 
                          name="content" 
                          required
                          rows="12"
                          placeholder="用文字记录你的思想..."
                          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition resize-y"></textarea>
                <p class="text-xs text-gray-400 mt-1">支持 Markdown 格式，换行自动分段</p>
            </div>
            <div class="flex items-center gap-4 pt-4">
                <button type="submit" 
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg shadow-sm transition-colors">
                    发布文章 🚀
                </button>
                <a href="{{ url_for('index') }}" 
                   class="text-gray-500 hover:text-gray-700 text-sm transition-colors">
                    取消
                </a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
